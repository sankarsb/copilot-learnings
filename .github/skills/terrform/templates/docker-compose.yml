version: '3.9'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-webserver
    restart: always
    
    ports:
      - "8000:80"
    
    volumes:
      - nginx_config:/etc/nginx
      - nginx_logs:/var/log/nginx
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    
    environment:
      TZ: UTC
      NGINX_PORT: "80"
    
    networks:
      - nginx-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    labels:
      com.example.description: "Nginx web server"
      com.example.managed_by: "docker-compose"
      environment: "production"

volumes:
  nginx_config:
    driver: local
    labels:
      com.example.description: "Nginx configuration volume"
  
  nginx_logs:
    driver: local
    labels:
      com.example.description: "Nginx logs volume"

networks:
  nginx-network:
    driver: bridge
    labels:
      com.example.description: "Nginx network"
