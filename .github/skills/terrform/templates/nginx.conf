# Sample Nginx Configuration for Docker
# This is a default configuration - customize as needed

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Server block listening on port 80 (internal to container, exposed as 8000 via Docker)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Static file serving
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            
            # Browser cache settings
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Status endpoint (optional)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.17.0.0/16;  # Docker bridge network
            deny all;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Example: Reverse proxy configuration (uncomment and customize as needed)
    # server {
    #     listen 80;
    #     server_name api.example.com;
    #
    #     location / {
    #         proxy_pass http://backend:3000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    # Example: Load balancing (uncomment and customize as needed)
    # upstream backend {
    #     server backend1:3000 weight=5;
    #     server backend2:3000 weight=3;
    #     server backend3:3000 weight=2;
    # }
    #
    # server {
    #     listen 80;
    #     server_name api.example.com;
    #
    #     location / {
